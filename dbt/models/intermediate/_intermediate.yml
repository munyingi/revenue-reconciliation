version: 2

models:
  - name: int_payments
    description: One row per PSP payment, outcome taken from the first delivery of each event.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: int_orders__matched_to_payments
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_refunds__matched_to_orders
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null:
              config:
                severity: warn
